map $http_cf_connecting_ip $forwarded_for {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 21m;
    absolute_redirect off;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS. A variable in proxy_pass makes nginx resolve api on each request.
    # The supported stack runs one API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    location /api/ {
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy-api.conf;
    }

    location = /robots.txt {
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy-api.conf;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
